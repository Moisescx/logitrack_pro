<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Asignar Ruta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 flex items-center justify-center min-h-screen">

<div class="w-full max-w-md bg-white dark:bg-slate-800 p-8 rounded-xl shadow-2xl border border-gray-100 dark:border-slate-700">

    <h2 class="text-2xl font-bold mb-6 dark:text-white text-center">Asignar Camión a Ruta</h2>

    <div class="bg-slate-50 dark:bg-slate-700 p-4 rounded-lg mb-6 border dark:border-slate-600">
        <p class="text-sm text-gray-500 dark:text-gray-400 uppercase font-semibold">Detalles de la Ruta</p>
        <p class="mt-2 dark:text-white"><strong>De:</strong> <span th:text="${ruta.origen}"></span></p>
        <p class="dark:text-white"><strong>A:</strong> <span th:text="${ruta.destino}"></span></p>
    </div>

    <form th:action="@{/despachador/asignar/{id}(id=${ruta.id})}" method="POST" class="space-y-6">

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Selecciona un camión
                disponible:</label>
            <select name="camionId" required
                    class="w-full px-4 py-3 border rounded-lg bg-white dark:bg-slate-700 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer">
                <option value="" disabled selected>-- Elige un camión --</option>
                <option th:each="c : ${camiones}"
                        th:value="${c.id}"
                        th:text="${c.patente + ' - ' + c.modelo + ' (' + c.capCarga + 'T)'}">
                </option>
            </select>
            <p th:if="${#lists.isEmpty(camiones)}" class="text-red-500 text-xs mt-2">No hay camiones disponibles en este
                momento.</p>
        </div>

        <div class="flex gap-4 pt-2">
            <a th:href="@{/despachador}"
               class="w-1/3 text-center bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-3 rounded-lg transition-colors">
                Volver
            </a>
            <button type="submit" th:disabled="${#lists.isEmpty(camiones)}"
                    class="w-2/3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow transition-colors disabled:bg-indigo-400 disabled:cursor-not-allowed">
                Confirmar Despacho
            </button>
        </div>
    </form>
</div>

</body>
</html>
