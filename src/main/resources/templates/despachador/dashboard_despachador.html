<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Panel Despachador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen">

<div class="max-w-7xl mx-auto p-6">
    <div class="flex items-center justify-between mb-8 border-b pb-4 dark:border-slate-700">
        <h2 class="text-3xl font-bold">📋 Panel del Despachador</h2>
        <div class="flex items-center gap-3">
            <button onclick="document.documentElement.classList.toggle('dark')"
                    class="px-3 py-2 rounded bg-gray-300 dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-sm shadow">
                🌓 Cambiar tema
            </button>
            <a th:href="@{/mapa}"
               class="px-3 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm shadow">Ver mapa</a>

            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit"
                        class="px-3 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm shadow">Cerrar sesión
                </button>
            </form>
        </div>
    </div>

    <!-- Mi Flota Asignada -->
    <h3 class="text-xl font-semibold mb-4 text-slate-700 dark:text-slate-300">🚚 Tu Flota Asignada</h3>

    <div th:if="${not #lists.isEmpty(miFlota)}" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div th:each="camion : ${miFlota}" class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-md border-l-4"
             th:classappend="${camion.estado == 'disponible' ? 'border-green-500' : 'border-blue-500'}">

            <p class="text-lg font-bold mb-2 dark:text-white" th:text="${camion.patente}"></p>
            <p class="text-sm text-gray-600 dark:text-gray-400"><strong>Modelo:</strong> <span
                    th:text="${camion.modelo}"></span></p>
            <p class="text-sm text-gray-600 dark:text-gray-400"><strong>Capacidad:</strong> <span
                    th:text="${#numbers.formatDecimal(camion.capCarga, 1, 1)} + ' T'"></span></p>

            <div class="mt-3">
                <span th:if="${camion.estado == 'disponible'}"
                      class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded-full font-semibold">🟢 Disponible</span>
                <span th:if="${camion.estado == 'en_ruta'}"
                      class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full font-semibold">🔵 En Ruta</span>
                <span th:if="${camion.estado == 'mantenimiento'}"
                      class="px-2 py-1 bg-red-100 text-red-800 text-xs rounded-full font-semibold">🔴 En Taller</span>
            </div>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(miFlota)}" class="text-gray-500 mb-8 italic">No tienes camiones asignados a tu
        nombre.</p>

    <!-- Rutas Pendientes -->
    <h3 class="text-xl font-semibold mb-4 text-slate-700 dark:text-slate-300">Rutas Esperando Asignación</h3>

    <div th:if="${not #lists.isEmpty(rutasPendientes)}" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div th:each="ruta : ${rutasPendientes}"
             class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-md flex flex-col justify-between border-l-4 border-yellow-500">
            <div>
                <div class="flex items-center gap-2 mb-2">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                    <p class="font-medium dark:text-white" th:text="${ruta.origen}"></p>
                </div>
                <div class="flex items-center gap-2 mb-3">
                    <span class="w-2 h-2 rounded-full bg-red-500"></span>
                    <p class="font-medium dark:text-white" th:text="${ruta.destino}"></p>
                </div>
                <span class="px-2 py-1 bg-yellow-100 text-yellow-800 text-xs rounded-full font-semibold">Pendiente</span>
            </div>

            <div class="mt-5">
                <a th:href="@{/despachador/asignar/{id}(id=${ruta.id})}"
                   class="block text-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow transition-colors">
                    Asignar Vehículo
                </a>
            </div>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(rutasPendientes)}" class="text-gray-500 italic">No hay rutas pendientes de asignación.
        ¡Todo al día!</p>

</div>
</body>
</html>
