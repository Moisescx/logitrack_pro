<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Panel Chofer</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen">

<div class="max-w-7xl mx-auto p-6">

    <!-- Cabecera -->
    <div class="flex items-center justify-between mb-8 border-b pb-4 dark:border-slate-700">
        <h2 class="text-3xl font-bold">🚛 Panel de Conducción</h2>
        <div class="flex items-center gap-3">
            <button onclick="document.documentElement.classList.toggle('dark')"
                    class="px-3 py-2 rounded bg-gray-300 dark:bg-gray-700 text-gray-900 dark:text-gray-100 text-sm shadow transition-colors">
                🌓 Cambiar tema
            </button>

            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit"
                        class="px-3 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm shadow transition-colors">
                    Cerrar sesión
                </button>
            </form>
        </div>
    </div>

    <!-- Panel de Estadísticas (Info del camión) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-md border-t-4 border-indigo-500 flex flex-col items-center justify-center">
            <p class="text-sm text-gray-500 dark:text-gray-400 uppercase font-semibold mb-1">Camión Asignado</p>
            <p class="text-2xl font-bold dark:text-white" th:text="${camion != null ? camion.patente : 'Ninguno'}">
                AB-CD-12</p>
        </div>
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-md border-t-4 border-yellow-500 flex flex-col items-center justify-center">
            <p class="text-sm text-gray-500 dark:text-gray-400 uppercase font-semibold mb-1">Rutas Pendientes</p>
            <p class="text-3xl font-bold text-yellow-600 dark:text-yellow-400" th:text="${pendientes}">0</p>
        </div>
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-md border-t-4 border-green-500 flex flex-col items-center justify-center">
            <p class="text-sm text-gray-500 dark:text-gray-400 uppercase font-semibold mb-1">Rutas Completadas</p>
            <p class="text-3xl font-bold text-green-600 dark:text-green-400" th:text="${completadas}">0</p>
        </div>
    </div>

    <!-- Rutas Asignadas -->
    <div class="flex items-center justify-between mb-6">
        <h3 class="text-2xl font-semibold text-slate-700 dark:text-slate-300">📋 Tus Rutas Programadas</h3>
    </div>

    <div th:if="${not #lists.isEmpty(rutas)}">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-10">

            <!-- Iteración de rutas LIMPIA -->
            <div th:each="ruta : ${rutas}"
                 class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-md flex flex-col justify-between border-l-4 transition-all duration-300"
                 th:classappend="${ruta.estado == 'pendiente' ? 'border-yellow-500' : (ruta.estado == 'en_progreso' ? 'border-blue-500' : 'border-green-500')}">

                <div>
                    <!-- Origen y Destino -->
                    <div class="flex items-center gap-2 mb-2">
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                        <p class="font-medium dark:text-white text-lg" th:text="${ruta.origen}"></p>
                    </div>
                    <div class="flex items-center gap-2 mb-4">
                        <span class="w-2 h-2 rounded-full bg-red-500"></span>
                        <p class="font-medium dark:text-white text-lg" th:text="${ruta.destino}"></p>
                    </div>

                    <!-- Badges de estado -->
                    <div class="mb-4">
                        <span th:if="${ruta.estado == 'pendiente'}"
                              class="px-3 py-1 bg-yellow-100 text-yellow-800 text-xs rounded-full font-bold uppercase tracking-wider">Pendiente</span>
                        <span th:if="${ruta.estado == 'en_progreso'}"
                              class="px-3 py-1 bg-blue-100 text-blue-800 text-xs rounded-full font-bold uppercase tracking-wider">En Progreso</span>
                        <span th:if="${ruta.estado == 'completada'}"
                              class="px-3 py-1 bg-green-100 text-green-800 text-xs rounded-full font-bold uppercase tracking-wider">Completada</span>
                    </div>
                </div>

                <div class="mt-4 pt-4 border-t dark:border-slate-700">
                    <!-- Botones si está pendiente -->
                    <div th:if="${ruta.estado == 'pendiente'}" class="flex items-center justify-between w-full">
                        <form th:action="@{/chofer/iniciar/{id}(id=${ruta.id})}" method="POST" class="w-full">
                            <button type="submit"
                                    class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition-colors">
                                Iniciar Ruta
                            </button>
                        </form>
                    </div>

                    <!-- Botones si está en progreso -->
                    <div th:if="${ruta.estado == 'en_progreso'}" class="flex flex-col gap-3">
                        <div class="flex gap-2">
                            <form th:action="@{/chofer/finalizar/{id}(id=${ruta.id})}" method="POST" class="flex-1">
                                <button type="submit"
                                        class="w-full py-2 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-lg shadow transition-colors">
                                    Finalizar
                                </button>
                            </form>
                            <button class="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow transition-colors">
                                Emergencia
                            </button>
                        </div>
                    </div>

                    <!-- Mensaje si está completada -->
                    <div th:if="${ruta.estado == 'completada'}" class="text-center">
                        <span class="text-green-600 dark:text-green-400 font-bold">¡Viaje Finalizado! 🎉</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div th:if="${#lists.isEmpty(rutas)}"
         class="bg-white dark:bg-slate-800 p-8 rounded-xl shadow-md text-center border dark:border-slate-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-400 mb-4" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <p class="text-lg text-gray-500 dark:text-gray-400">No tienes rutas asignadas en este momento.</p>
        <p class="text-sm text-gray-400 mt-2">Relájate o comunícate con tu despachador.</p>
    </div>

    <!-- Botón del Mapa -->
    <div class="flex justify-center mt-12 mb-8">
        <a th:href="@{/mapa}"
           class="inline-flex items-center gap-2 px-8 py-4 bg-slate-800 dark:bg-slate-700 text-white text-lg font-semibold rounded-xl shadow-lg hover:bg-slate-900 dark:hover:bg-slate-600 transition-all transform hover:-translate-y-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
            </svg>
            Abrir GPS / Mapa Interactivo
        </a>
    </div>
</div>

<!-- Scripts -->
<script th:src="@{/js/contador.js}"></script>
</body>
</html>
