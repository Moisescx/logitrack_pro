<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin - Editar Ruta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>

<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 flex items-center justify-center min-h-screen">

<div class="w-full max-w-lg bg-white dark:bg-slate-800 p-8 rounded-xl shadow-xl border border-gray-100 dark:border-slate-700">

    <div class="flex justify-between items-center mb-6 border-b pb-4 dark:border-slate-700">
        <h2 class="text-2xl font-bold dark:text-white">Editar Ruta</h2>
        <a th:href="@{/admin/rutas}"
           class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </a>
    </div>

    <form th:action="@{/admin/rutas/editar/{id}(id=${ruta.id})}" method="POST" class="space-y-5">

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Punto de Origen</label>
            <input type="text" name="origen" th:value="${ruta.origen}" required
                   class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Punto de Destino</label>
            <input type="text" name="destino" th:value="${ruta.destino}" required
                   class="w-full px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Estado de la Ruta</label>
            <select name="estado"
                    class="w-full px-4 py-2 border rounded-lg bg-white dark:bg-slate-700 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="pendiente" th:selected="${ruta.estado == 'pendiente'}">Pendiente</option>
                <option value="en_progreso" th:selected="${ruta.estado == 'en_progreso'}">En Progreso</option>
                <option value="completada" th:selected="${ruta.estado == 'completada'}">Completada</option>
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Camión Asignado</label>
            <!-- Ojo aquí: usamos un nombre distinto (camionId) para atraparlo fácil en Java -->
            <select name="camionId"
                    class="w-full px-4 py-2 border rounded-lg bg-white dark:bg-slate-700 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">-- Sin asignar --</option>
                <option th:each="c : ${camiones}"
                        th:value="${c.id}"
                        th:text="${c.patente + ' - ' + c.modelo}"
                        th:selected="${ruta.camion != null and ruta.camion.id == c.id}">
                </option>
            </select>
        </div>

        <div class="flex gap-4 mt-8">
            <a th:href="@{/admin/rutas}"
               class="w-1/3 text-center bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2.5 rounded-lg shadow transition-colors">
                Cancelar
            </a>
            <button type="submit"
                    class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow transition-colors">
                Guardar Cambios
            </button>
        </div>
    </form>
</div>

</body>
</html>
